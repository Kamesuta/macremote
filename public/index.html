<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Control Your PC">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <title>Control Your PC</title>
</head>
<body>
  <div id="app">
    <div id="handoff" hidden><p id="handoff-msg"></p><button id="handoff-show" aria-label="Show the window again">枠へ</button><button id="handoff-done" class="primary">完了</button></div>
    <div id="screen"><div id="zoom"></div><div id="pointer" hidden></div><div id="mark" hidden></div></div>
    <div id="status" hidden></div>
    <form id="textbar" hidden autocomplete="off">
      <input id="txt" type="text" placeholder="Type or paste text to send to the Mac" autocomplete="off" autocorrect="on" autocapitalize="sentences" enterkeyhint="send">
      <button type="submit" class="primary">Send</button>
      <button type="button" id="txt-return" aria-label="Send then press Return">Send ↵</button>
    </form>
    <div id="toolbar" hidden>
      <button id="btn-kbd" aria-label="Keyboard">⌨</button>
      <button id="btn-text" aria-label="Text box">Aa</button>
      <button id="btn-pad" aria-label="Trackpad mode">Pad</button>
      <button id="btn-zoom" aria-label="Reset zoom">1×</button>
      <button data-key="0xFF1B">Esc</button>
      <button data-key="0xFF09">Tab</button>
      <button data-mod="0xFFE3">Ctrl</button>
      <button data-mod="0xFFE9">Opt</button>
      <button data-mod="0xFFEB">⌘</button>
      <button data-key="0xFF51">←</button>
      <button data-key="0xFF52">↑</button>
      <button data-key="0xFF54">↓</button>
      <button data-key="0xFF53">→</button>
      <button id="btn-close" class="danger">Close</button>
    </div>
    <form id="connect" class="card" autocomplete="on">
      <h1>Connect to your Mac</h1>
      <label for="user">Mac username</label>
      <input id="user" type="text" autocapitalize="off" autocorrect="off" autocomplete="username">
      <label for="pass">Mac password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <label class="check"><input id="remember" type="checkbox" checked> Keep me connected on this iPhone</label>
      <p class="error" id="connect-error"></p>
      <button class="primary" type="submit">Connect</button>
    </form>
    <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1">
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
